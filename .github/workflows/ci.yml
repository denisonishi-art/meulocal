name: CI

on:
  push:
    branches: [main, feat/opendots-prospeccao-meulocal]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: OpenDots commercial decision tests
        run: node --test scripts/opendots-worker/commercial-engine.test.cjs scripts/opendots-worker/commercial-server.test.mjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
