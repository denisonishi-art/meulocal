name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Review monitoring tests
        run: |
          node --test scripts/check-review-monitor.cjs scripts/check-review-monitor-routes.cjs scripts/check-review-monitor-release.cjs scripts/check-customer-dashboard.cjs
          node scripts/check-review-monitor-database.cjs
      - name: Payment plan contracts
        run: |
          node --test scripts/check-payment-plans.cjs
          node scripts/check-payment-plans-database.cjs
      - name: Manual prospect search and draft contracts
        run: node --test scripts/check-manual-prospect-search.cjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
