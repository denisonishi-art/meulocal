name: MeuLocal - Validate branch
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/opendots-prospeccao-meulocal]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Inbound intent safety checks
        run: node scripts/check-inbound-intent.cjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
